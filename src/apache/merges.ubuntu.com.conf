<VirtualHost *:8080>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # combined, plus the client address forwarded by the proxy, since %h
    # is always the proxy
    CustomLog /var/log/apache2/merges.ubuntu.com-access.log "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\""
    ErrorLog /var/log/apache2/merges.ubuntu.com-error.log

    DocumentRoot    /srv/merges/merges/

    # Reject /universe.html/<anything>, which mod_python would render as the
    # status page with relative links resolving one level deeper on every hit.
    # AcceptPathInfo Off doesn't apply to mod_python handlers.
    RedirectMatch 404 "^/[^/]+\.(html|psp|py)/"

    <Directory /srv/merges/merges>
        Options FollowSymLinks Indexes
        AllowOverride FileInfo
        Require all granted
        IndexOptions DescriptionWidth=* NameWidth=*
    </Directory>
    AddHandler mod_python .html
    AddHandler mod_python .py
    AddHandler mod_python .psp
    PythonHandler mod_python.psp
    PythonPath "sys.path+['/srv/merges/code']"

</VirtualHost>
