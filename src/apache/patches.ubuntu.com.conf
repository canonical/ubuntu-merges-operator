<VirtualHost *:8081>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # combined, plus the client address forwarded by the proxy, since %h
    # is always the proxy
    CustomLog /var/log/apache2/patches.ubuntu.com-access.log "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\""
    ErrorLog /var/log/apache2/patches.ubuntu.com-error.log

    DocumentRoot    /srv/merges/published/

    <Directory /srv/merges/published>
        Options FollowSymLinks Indexes
        AllowOverride FileInfo
        Require all granted
        IndexOptions DescriptionWidth=* NameWidth=*
    </Directory>

</VirtualHost>
